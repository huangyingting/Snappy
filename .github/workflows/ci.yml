name: Production readiness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025"]
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: snappy
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: snappy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: file:./prisma/dev.db
      NEXTAUTH_URL: http://localhost:3000
      TEST_SMTP_URL: smtp://localhost:1025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:validate:all
      - run: npm run lint
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://snappy:test-only-password@localhost:5432/snappy_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          DATABASE_URL: postgresql://snappy:test-only-password@localhost:5432/snappy_test
      - run: npm run typecheck
